[project]
name = "villms-inference"
version = "0.1.0"
description = "Reproducible smoke-test inference harness for Vietnamese SLM evaluation"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.34",
    "torch>=2.2",
    "transformers>=4.45",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
villms-run = "villms_inference.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/villms_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
